name: Atualizar devocional diário

on:
  schedule:
    # 08:00 UTC = 05:00 em Brasília (UTC-3, sem horário de verão)
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/devocionais.json"
      - "data/oracoes.json"
      - "scripts/atualizar.py"

permissions:
  contents: write

concurrency:
  group: atualizar-devocional
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar conteúdo
        run: python scripts/atualizar.py --validar

      - name: Publicar devocional do dia
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/atualizar.py

      - name: Salvar alterações
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Devocional de $(TZ=America/Sao_Paulo date +%F)"
            git push
          else
            echo "Nada a publicar."
          fi
